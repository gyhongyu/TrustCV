<body class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-brand-emerald selection:text-white transition-colors duration-200">
  <!-- 2 秒開場啟動加載畫面 (純原生內聯樣式 + 零依賴倒數守衛，徹底杜絕手機弱網卡屏) -->
  <div id="splash-screen" style="position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #080C0E; user-select: none; transition: opacity 0.5s ease, visibility 0.5s ease;">
    <!-- 官方定版加載畫面 SVG (APP開啟加載畫面.svg) -->
    <div style="width: 220px; height: 220px; max-width: 70vw; max-height: 70vw; display: flex; align-items: center; justify-content: center;">
      <img src="./assets/svg/APP開啟加載畫面.svg" alt="TrustCV Loading" style="width: 100%; height: 100%; object-fit: contain;">
    </div>

    <!-- 加載進度條與安全連線指示 (純原生樣式，零依賴 Tailwind) -->
    <div style="width: 240px; max-width: 80vw; margin-top: 24px; display: flex; flex-direction: column; align-items: center;">
      <div style="width: 100%; background-color: #121A24; height: 4px; border-radius: 9999px; overflow: hidden; border: 1px solid #1E293B;">
        <div id="splash-progress-bar" style="height: 100%; width: 0%; background: linear-gradient(90deg, #10B981, #40F5A3); border-radius: 9999px; transition: width 0.4s ease;"></div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 11px; font-family: monospace; color: #3DF5A7;">
        <span id="splash-status-text">Establishing Secure Vault...</span>
      </div>
    </div>
  </div>

  <!-- 原生倒數兜底防線：不管網路、快取或模組加載狀況，2 秒準時淡出移除，絕不卡死手機 -->
  <script>
    (function() {
      var bar = document.getElementById('splash-progress-bar');
      var status = document.getElementById('splash-status-text');
      var splash = document.getElementById('splash-screen');
      if (bar) {
        setTimeout(function() { bar.style.width = '45%'; }, 150);
        setTimeout(function() { 
          bar.style.width = '85%'; 
          if (status) status.textContent = 'Verifying Credence Node...';
        }, 800);
        setTimeout(function() { 
          bar.style.width = '100%'; 
          if (status) status.textContent = 'Vault Ready.';
        }, 1500);
      }
      setTimeout(function() {
        if (splash) {
          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(function() { splash.remove(); }, 500);
        }
      }, 2000);
    })();
  </script>

  <!-- PWA SPA Root Container: 全寬響應式自適應容器 (打破 max-w-md 限制) -->
  <div id="app-root" class="min-h-screen flex flex-col w-full"></div>

  <!-- Entry Script (ES Modules) -->
  <script type="module" src="./js/app.js"></script>
</body>
