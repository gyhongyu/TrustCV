<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- 背景圓角裁切/陰影設定 -->
    <linearGradient id="grad-top" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#143b32"/>
      <stop offset="100%" stop-color="#2a725e"/>
    </linearGradient>

    <linearGradient id="grad-mid" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#1a6652"/>
      <stop offset="100%" stop-color="#34b285"/>
    </linearGradient>

    <linearGradient id="grad-bot" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#22b573"/>
      <stop offset="100%" stop-color="#40f5a3"/>
    </linearGradient>
  </defs>

  <!-- 1. 背景深色圓角卡片 -->
  <rect width="800" height="800" rx="140" fill="#080c0e"/>

  <!-- 2. 圖標群組（三層折角與八角沖孔） -->
  <g id="check-group">
    <!-- 頂層折角（深墨綠） -->
    <path fill="url(#grad-top)" fill-rule="evenodd" d="
      M 375,246
      L 283,154
      L 315,122
      L 375,182
      L 501,56
      L 533,88
      Z
      M 502,94.6
      L 494.4,87
      L 483.6,87
      L 476,94.6
      L 476,105.4
      L 483.6,113
      L 494.4,113
      L 502,105.4
      Z
    "/>

    <!-- 中層折角（翡翠綠） -->
    <path fill="url(#grad-mid)" fill-rule="evenodd" d="
      M 375,352
      L 283,260
      L 315,228
      L 375,288
      L 501,162
      L 533,194
      Z
      M 502,200.6
      L 494.4,193
      L 483.6,193
      L 476,200.6
      L 476,211.4
      L 483.6,219
      L 494.4,219
      L 502,211.4
      Z
    "/>

    <!-- 底層折角（亮薄荷綠） -->
    <path fill="url(#grad-bot)" fill-rule="evenodd" d="
      M 375,458
      L 283,366
      L 315,334
      L 375,394
      L 501,268
      L 533,300
      Z
      M 502,306.6
      L 494.4,299
      L 483.6,299
      L 476,306.6
      L 476,317.4
      L 483.6,325
      L 494.4,325
      L 502,317.4
      Z
    "/>
  </g>

  <!-- 3. 文字品牌標識 -->
  <g id="brand-text">
    <!-- 主標題：TrustCV -->
    <text x="400" y="635" text-anchor="middle" font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Segoe UI', Arial, sans-serif">
      <tspan fill="#ffffff" font-size="94" font-weight="800">Trust</tspan>
      <tspan fill="#3de098" font-size="94" font-weight="800">CV</tspan>
    </text>

    <!-- 副標題：BY TEAFORIA -->
    <text x="400" y="700" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="600" font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Segoe UI', Arial, sans-serif" letter-spacing="7">
      BY TEAFORIA
    </text>
  </g>
</svg>
